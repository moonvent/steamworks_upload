[package]
name = "steamproject_update"
version = "0.3.0"
edition = "2024"
description = "Browser-based Steamworks store auditing and draft editing"
license = "MIT"
readme = "README.md"
include = ["src/**", "templates/**", "examples/**", "tools/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE", "AGENTS.md", "run.sh"]

[dependencies]
base64 = "0.23"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }
thirtyfour = "0.38"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
