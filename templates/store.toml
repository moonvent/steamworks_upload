# Reviewed against the legacy editor and its public apps.js. No publication recipe.
[technical.stats]
path = "/apps/stats/{app}"
root = "#appStatDisplay"
table = "#statTable"
fetch_path = "/apps/fetchstats/{app}"
heading = "Stats Configuration"
heading_root = "#appFrame"
row_prefix = "s"
edit_prefix = "stat"
create_function = "PerformNewStat"
edit_function = "EditStat"
save = "input[type='submit'][value='Save']"
delete = "input[type='submit'][value='Delete']"
delete_name_cell = "td:nth-child(3)"

[technical.stats.fields.type]
suffix = "stattype"
tag = "select"

[technical.stats.fields.api_name]
suffix = "statapiname"
tag = "input"
input_type = "text"

[technical.stats.fields.permission]
suffix = "permission"
tag = "select"

[technical.stats.fields.increment_only]
suffix = "incrementonly"
tag = "input"
input_type = "checkbox"

[technical.stats.fields.max_change]
suffix = "maxchange"
tag = "input"
input_type = "text"

[technical.stats.fields.min]
suffix = "min"
tag = "input"
input_type = "text"

[technical.stats.fields.max]
suffix = "max"
tag = "input"
input_type = "text"

[technical.stats.fields.window]
suffix = "windowsize"
tag = "input"
input_type = "text"

[technical.stats.fields.default]
suffix = "default"
tag = "input"
input_type = "text"

[technical.stats.fields.aggregated]
suffix = "aggregated"
tag = "input"
input_type = "checkbox"

[technical.stats.fields.display_name]
suffix = "displayname"
tag = "input"
input_type = "text"

# Reviewed against the legacy editor and its public apps.js. No publication recipe.
[technical.achievements]
