version = 1
name = "Steamworks store editor"

# Reviewed on the native Tag Wizard. These choices are local survey state;
# selecting a checkbox is not proof of a saved or published tag configuration.
[tag_wizard]
bootstrap_marker = "initSurvey("
origin = "https://partner.steamgames.com"
path_prefix = "/taxonomy/tagwizard/"
identity = ".appName"
question = "#q_super_genre"
title = "#question_title"
expected_title = "TOP-LEVEL GENRES"
choices = "#choices input.input_choice"
adventure = "#q_super_genre input.input_choice[value='21']"
adventure_label = "Adventure"
adventure_click = "#q_super_genre label[for='input_choice_2']"

[page]
origin = "https://partner.steamgames.com"
path_prefix = "/admin/game/edit/"
form_selector = "form#gameform"
save_path_prefix = "/admin/game/save/"

[tabs.basic]
nav = "#tab_basic"
content = "#tab_basic_content"
save = "input[type='submit'][value='Save']"
[tabs.description]
nav = "#tab_description"
content = "#tab_description_content"
save = "input[type='submit'][value='Save']"
[tabs.ratings]
nav = "#tab_ratings"
content = "#tab_ratings_content"
[tabs.earlyaccess]
nav = "#tab_earlyaccess"
content = "#tab_earlyaccess_content"
save = "input[type='submit'][value='Save']"
[tabs.graphicalassets]
nav = "#tab_graphicalassets"
content = "#tab_graphicalassets_content"
[tabs.movies]
nav = "#tab_movies"
content = "#tab_movies_content"
[tabs.specialsettings]
nav = "#tab_specialsettings"
content = "#tab_specialsettings_content"
save = "input[type='submit'][value='Save Changes']"
[tabs.localization]
nav = "#tab_localization"
content = "#tab_localization_content"
[tabs.publish]
nav = "#tab_publish"
content = "#tab_publish_content"
read_only = true

[fields.name]
tab = "basic"
selector = 'input[name="app[name]"]'
tag = "input"
input_type = "text"
expected_name = "app[name]"
[fields.short_description]
tab = "description"
selector = "#app_content_short_description__textarea"
expected_id = "app_content_short_description__textarea"
tag = "textarea"
[fields.language]
tab = "description"
selector = "#app_content_short_description__select"
expected_id = "app_content_short_description__select"
tag = "select"
[fields.about]
tab = "description"
selector = "[data-featuretarget=\"storeadmin-app-description-editor\"][data-props*='\"editorType\":\"aboutthegame\"']"
tag = "div"

[localization]
short_value = 'input[name="app[content][short_description][{language}]"]'
about_value = 'input[name="app[content][about][{language}]"]'
current_language = "#app_content_short_description__currentlanguage"

# Reviewed on the Localization tab: export only, no form submission.
[localization_download]
format = "#tab_localization_content select#downloadLocFormat"
language = "#tab_localization_content select#downloadLocLanguage"
button = "#tab_localization_content button#downloadLocButton"
button_text = "Download Localization"

