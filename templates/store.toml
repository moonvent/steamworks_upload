file = "input[type='file'][name='image']"
submit = "input[type='submit'][value='Upload']"
callback = "AchievementImageUploadCallbackClosure"
max_bytes = 3000000

[technical.achievements.fields.api_name]
suffix = "apiname"
tag = "input"
